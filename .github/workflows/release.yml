name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A personal access token, so CI also runs on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
